name: Generate Snake

on:
  # Executa automaticamente a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  # Permite rodar manualmente na aba Actions
  workflow_dispatch:

  # Executa também a cada push feito no branch principal (main ou master)
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Gera os arquivos da cobrinha na pasta dist/
      - name: Generate the snake files
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange

      - name: Show build status
        run: git status

      # Envia os arquivos gerados para uma branch chamada 'output'
      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
